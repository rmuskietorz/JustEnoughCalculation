plugins {
    id "architectury-plugin" version "3.4.162"
    id "dev.architectury.loom" version "1.11.454-patched" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // The following line declares the mojmap mappings, you may use other mappings as well
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-1.21.1:2024.11.17@zip")
        }
        // The following line declares the yarn mappings you may select this one as well.
        // mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
        compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = "https://dvs1.progwml6.com/files/maven" }
        maven { url = "https://maven.shedaniel.me" }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://maven.neoforged.net/releases" }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "dev.architectury") {
                def name = details.requested.name
                if (name.startsWith("architectury")
                        && !name.contains("transformer")
                        && !name.contains("injectables")) {
                    details.useVersion(rootProject.architectury_version)
                }
            }
        }
    }
}
